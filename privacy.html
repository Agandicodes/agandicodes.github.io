<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — AgandiCodes</title>
  <meta name="description" content="Privacy Policy for AgandiCodes websites and mobile applications, including the Luganda Bible app.">
  <meta name="theme-color" content="#4B1E6F">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/img/android-chrome-512x512.png">
  <link rel="manifest" href="assets/img/site.webmanifest">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Apply saved theme early -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark-mode');
        document.documentElement.classList.add('theme-ready');
      }
    })();
  </script>

  <style>
    :root {
      --purple-deep: #2B0B40;
      --purple-primary: #4B1E6F;
      --purple-light: #6B3B93;
      --purple-soft: #EADCF6;
      --gold: #D4AF37;
      --gold-dark: #A67C00;
      --warm-white: #FFFDF8;
      --ink: #241A2B;
      --muted-ink: #5B4A66;
      --surface: #FFFFFF;
      --surface-alt: #F7F2FB;
      --border: #E5D9F0;
      --link: #4B1E6F;
    }

    html.dark-mode,
    body.dark-mode {
      --warm-white: #160A22;
      --surface: #221030;
      --surface-alt: #2B1839;
      --ink: #F4EEFA;
      --muted-ink: #C9B8D9;
      --border: #3A2549;
      --purple-soft: #3A1E56;
      --link: #E8CB6A;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--warm-white);
      color: var(--ink);
      line-height: 1.65;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      transition: background-color .25s ease, color .25s ease;
    }

    /* ---------- Header ---------- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--purple-primary);
      color: #fff;
      box-shadow: 0 2px 14px rgba(43, 11, 64, .25);
    }

    .site-header .inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-header .brand {
      font-family: "Poppins", sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: .3px;
      color: #fff;
      text-decoration: none;
    }

    .site-header .brand span { color: var(--gold); }

    .site-header .spacer { flex: 1; }

    .site-header a.nav-link {
      color: #fff;
      text-decoration: none;
      font-size: .9rem;
      opacity: .9;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background-color .2s ease, opacity .2s ease;
    }

    .site-header a.nav-link:hover {
      background: rgba(255, 255, 255, .12);
      opacity: 1;
    }

    .theme-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
    }

    .theme-btn:hover { background: rgba(255, 255, 255, .12); }

    /* ---------- Hero ---------- */
    .hero {
      background: linear-gradient(135deg, var(--purple-primary) 0%, var(--purple-deep) 100%);
      color: #fff;
      padding: 56px 20px 64px;
      text-align: center;
    }

    .hero h1 {
      font-family: "Poppins", sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin: 0 0 10px;
      letter-spacing: .3px;
      font-weight: 700;
    }

    .hero p {
      margin: 0 auto;
      max-width: 680px;
      color: rgba(255, 255, 255, .85);
      font-size: 1rem;
    }

    .hero .pill {
      display: inline-block;
      margin-top: 18px;
      background: rgba(212, 175, 55, .18);
      border: 1px solid rgba(212, 175, 55, .55);
      color: var(--gold);
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* ---------- Layout ---------- */
    .layout {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 40px;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; gap: 24px; padding-top: 24px; }
    }

    /* ---------- TOC ---------- */
    .toc {
      position: sticky;
      top: 78px;
      align-self: start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      font-size: .9rem;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .toc h2 {
      font-family: "Poppins", sans-serif;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted-ink);
      margin: 0 0 10px;
    }

    .toc ol { margin: 0; padding-left: 18px; color: var(--muted-ink); }
    .toc li { margin: 6px 0; }

    .toc a {
      color: var(--muted-ink);
      text-decoration: none;
      transition: color .15s ease;
    }

    .toc a:hover { color: var(--link); }

    @media (max-width: 860px) {
      .toc { position: static; max-height: none; }
    }

    /* ---------- Content ---------- */
    .content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 34px;
      box-shadow: 0 6px 30px rgba(43, 11, 64, .05);
    }

    @media (max-width: 520px) {
      .content { padding: 24px 18px; border-radius: 16px; }
    }

    .content .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      font-size: .82rem;
      color: var(--muted-ink);
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .content .meta strong { color: var(--ink); font-weight: 600; }

    .content h2 {
      font-family: "Poppins", sans-serif;
      font-size: 1.28rem;
      color: var(--purple-primary);
      margin: 34px 0 10px;
      padding-top: 6px;
      scroll-margin-top: 90px;
    }

    body.dark-mode .content h2 { color: #E8CB6A; }
